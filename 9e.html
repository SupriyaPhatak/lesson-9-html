<!DOCTYPE html>
<html>
    <head>
        <title> Twitter box</title>
        <style>
            .image{
                border-radius: 50%;
                object-fit:cover;
                width: 50px;
                height: 50px;
                margin-right: 10px;
                vertical-align: middle;
              
                

            }

            .tweetbox{
                border: none;
                vertical-align: middle;
                 padding-top:15px;
                padding-left:15px;

            }

            .button{
                background-color: rgb(106, 152, 220);
                color: white;
                border-radius: 30px;
                border: none;
                padding-bottom: 10px;
                padding-top: 10px;
                padding-left:10px ;
                padding-right: 10px;
                width: 100px;
                margin-top: 10px;
                vertical-align: middle;
                
                
            }

            .box{
                border-color: grey;
                border-style: solid;
                width: 400px;
                height: 80px;
                display: inline-block;
                padding: 15px;
        
            }
        </style>


    </head>


    <body>
        <div class="box">
        <img class="image" src="cat1.jpeg">
        <input class="tweetbox" type="text" placeholder="Whats happening?">
        <button class="button">Tweet</button>
        </div>
        
    </body>




</html>
